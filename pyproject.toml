[project]
name = "regpilot"
version = "0.2.0"
description = "Tyre regulation orchestration: Watcher agent (Agent 1) on LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.16",
    "pydantic>=2.9",
    "requests>=2.32",
    "typer>=0.12",
    "truststore>=0.10",  # use the OS certificate store (corporate TLS-inspecting proxies)
    "langchain>=1.4.6",
    "langchain-ollama>=1.1.0",
]

# The review app is optional (~70 MB): uv sync --extra ui
[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.2"]

[project.scripts]
regpilot = "regpilot.core.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
